<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milk Logistics Analytics Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root {
            --dark-blue: #0f172a;
            --light-cyan: #22d3ee;
        }
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #334155; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-track { background-color: transparent; }
        
        .chat-container { height: calc(100vh - 220px); }
        .message-appear { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center">

    <div class="w-full max-w-5xl flex flex-col h-screen p-4 sm:p-6">
        
        <header class="flex justify-between items-center border-b border-slate-700 pb-4 mb-4">
            <div>
                <h1 class="text-2xl font-extrabold text-white flex items-center gap-2">
                    <span class="text-cyan-400">🥛</span> Dairy Logistics AI
                </h1>
                <p class="text-slate-400 text-xs sm:text-sm">Conversational SQL Query Engine</p>
            </div>
            <button onclick="window.location.reload()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded border border-slate-600">New Chat</button>
        </header>
        
        <div id="chatHistory" class="chat-container overflow-y-auto custom-scrollbar space-y-6 pr-2 mb-4">
            <div class="flex flex-col items-start message-appear">
                <div class="max-w-[85%] bg-slate-800 p-4 rounded-2xl rounded-tl-none border border-slate-700 shadow-md">
                    <p class="text-sm">Hello! I'm your logistics assistant. Ask me anything about routes, parties, or prices.</p>
                </div>
            </div>
        </div>

        <div class="mt-auto bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-2xl">
            <div class="flex flex-col sm:flex-row gap-3">
                <textarea 
                    id="question" 
                    placeholder="Ask a question..." 
                    class="flex-1 h-14 p-3 text-sm text-white bg-slate-700 border border-slate-600 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:outline-none resize-none placeholder-slate-400 transition"
                ></textarea>
                <button 
                    onclick="ask()" 
                    id="submitBtn"
                    class="px-6 py-2 font-bold text-slate-900 bg-cyan-400 rounded-xl hover:bg-cyan-300 transition flex items-center justify-center gap-2"
                >
                    <span>Send</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const MAX_RETRIES = 3;
        const INITIAL_DELAY_MS = 500;

        /**
         * Generic Toggle for collapsible sections
         */
        function toggleSection(id, showText, hideText) {
            const el = document.getElementById(id);
            const btn = document.getElementById('btn-' + id);
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                btn.innerText = hideText;
            } else {
                el.classList.add('hidden');
                btn.innerText = showText;
            }
        }

        function formatResults(rows) {
            if (!rows || rows.length === 0) return `<p class="text-slate-400 text-sm italic">No data returned.</p>`;
            const headers = Object.keys(rows[0]);
            let tableHtml = `<div class="overflow-x-auto rounded-lg border border-slate-700 mt-2 custom-scrollbar shadow-inner bg-slate-900">
                <table class="min-w-full divide-y divide-slate-700 text-xs">
                    <thead class="bg-slate-800"><tr>`;
            headers.forEach(h => tableHtml += `<th class="px-3 py-2 text-left font-semibold text-cyan-400 uppercase">${h}</th>`);
            tableHtml += `</tr></thead><tbody class="divide-y divide-slate-800">`;
            rows.forEach(row => {
                tableHtml += `<tr class="hover:bg-slate-800/50">`;
                headers.forEach(h => {
                    const val = row[h] !== null ? row[h] : 'NULL';
                    tableHtml += `<td class="px-3 py-2 text-slate-300">${val}</td>`;
                });
                tableHtml += `</tr>`;
            });
            return tableHtml + `</tbody></table></div>`;
        }

        async function ask() {
            const inputEl = document.getElementById('question');
            const chatHistory = document.getElementById('chatHistory');
            const question = inputEl.value.trim();
            if (!question) return;

            chatHistory.innerHTML += `
                <div class="flex flex-col items-end message-appear">
                    <div class="max-w-[85%] bg-cyan-600 text-white p-3 rounded-2xl rounded-tr-none shadow-md">
                        <p class="text-sm">${question}</p>
                    </div>
                </div>`;
            
            inputEl.value = '';
            chatHistory.scrollTop = chatHistory.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatHistory.innerHTML += `
                <div id="${loadingId}" class="flex flex-col items-start message-appear">
                    <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-md flex items-center gap-3">
                        <div class="animate-spin h-4 w-4 border-2 border-cyan-400 border-t-transparent rounded-full"></div>
                        <span class="text-sm text-slate-400">Querying database...</span>
                    </div>
                </div>`;
            chatHistory.scrollTop = chatHistory.scrollHeight;

            let responseData = null;
            let errorMsg = null;

            try {
                let res;
                for (let i = 0; i < MAX_RETRIES; i++) {
                    res = await fetch('/chatbot/api/query/', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({question: question})
                    });
                    if (res.ok) break;
                    await new Promise(r => setTimeout(r, INITIAL_DELAY_MS * Math.pow(2, i)));
                }
                if (!res.ok) throw new Error(`Server Error (${res.status})`);
                responseData = await res.json();
            } catch (e) {
                errorMsg = e.message;
            }

            document.getElementById(loadingId).remove();

            const aiMsgId = 'ai-' + Date.now();
            if (errorMsg || (responseData && responseData.error)) {
                chatHistory.innerHTML += `
                    <div class="flex flex-col items-start message-appear">
                        <div class="max-w-[90%] bg-red-900/30 border border-red-700 p-4 rounded-2xl text-red-200">
                            <p class="text-sm font-bold">Error</p>
                            <p class="text-xs">${errorMsg || responseData.error}</p>
                        </div>
                    </div>`;
            } else {
                const sql = responseData.sql || '-- No SQL provided';
                const rows = responseData.result || [];
                const tableId = 'table-' + aiMsgId;
                const sqlId = 'sql-' + aiMsgId;

                chatHistory.innerHTML += `
                    <div class="flex flex-col items-start message-appear w-full">
                        <div class="max-w-[95%] w-full bg-slate-800 p-4 rounded-2xl rounded-tl-none border border-slate-700 shadow-lg space-y-4">
                            
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-bold text-cyan-400 uppercase tracking-widest italic">AI Analysis</span>
                                <div class="flex gap-2">
                                    <button id="btn-${sqlId}" onclick="toggleSection('${sqlId}', 'Show SQL', 'Hide SQL')" class="text-[10px] bg-slate-700 px-2 py-1 rounded text-slate-300">Show SQL</button>
                                    <button id="btn-${tableId}" onclick="toggleSection('${tableId}', 'Show Table', 'Hide Table')" class="text-[10px] bg-slate-700 px-2 py-1 rounded text-slate-300">Show Table</button>
                                </div>
                            </div>

                            <p class="text-sm">Found <b>${rows.length}</b> records matching your request.</p>

                            <div id="${sqlId}" class="hidden">
                                <pre class="p-3 bg-slate-950 text-emerald-400 text-xs rounded-lg border border-slate-700 overflow-x-auto custom-scrollbar">${sql}</pre>
                            </div>

                            <div id="${tableId}" class="hidden">
                                ${formatResults(rows)}
                            </div>
                        </div>
                    </div>`;
            }
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        document.getElementById('question').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
        });
    </script>
</body>
</html>
